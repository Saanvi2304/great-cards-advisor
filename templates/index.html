<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great.cards Credit Card Advisor</title>
    <meta name="description" content="AI-powered credit card advisor for Indian users. Get personalized card recommendations, compare cards, and check eligibility.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a1f35;
            --bg-user-msg: #2563eb;
            --bg-bot-msg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --border: rgba(148, 163, 184, 0.1);
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --radius: 12px;
            --radius-lg: 20px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-card) 100%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .btn-reset {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        /* Chat area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 3px;
        }

        /* Welcome message */
        .welcome {
            text-align: center;
            padding: 48px 24px;
            animation: fadeIn 0.6s ease;
        }

        .welcome h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #e2e8f0, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto 24px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .suggestion {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .suggestion:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background: rgba(59, 130, 246, 0.1);
            transform: translateY(-1px);
        }

        /* Messages */
        .message {
            display: flex;
            gap: 10px;
            max-width: 720px;
            animation: slideUp 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message.user .msg-avatar {
            background: var(--bg-user-msg);
        }

        .message.bot .msg-avatar {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 14px;
            word-break: break-word;
        }

        .message.user .msg-bubble {
            background: var(--bg-user-msg);
            border-bottom-right-radius: 4px;
        }

        .message.bot .msg-bubble {
            background: var(--bg-bot-msg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .msg-bubble p { margin-bottom: 8px; }
        .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-bubble ul, .msg-bubble ol { padding-left: 18px; margin-bottom: 8px; }
        .msg-bubble li { margin-bottom: 4px; }
        .msg-bubble strong { color: #e2e8f0; font-weight: 600; }

        /* Policy notes */
        .policy-notes {
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(245, 158, 11, 0.08);
            border-left: 3px solid var(--warning);
            border-radius: 0 6px 6px 0;
            font-size: 12px;
            color: var(--warning);
        }

        /* Typing indicator */
        .typing {
            display: flex;
            gap: 10px;
            align-self: flex-start;
            animation: fadeIn 0.3s ease;
        }

        .typing-dots {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 14px 18px;
            background: var(--bg-bot-msg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            border-bottom-left-radius: 4px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: bounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.16s; }
        .typing-dot:nth-child(3) { animation-delay: 0.32s; }

        /* Input area */
        .input-area {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 10px;
            max-width: 780px;
            margin: 0 auto;
        }

        .input-field {
            flex: 1;
            padding: 12px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field::placeholder { color: var(--text-muted); }
        .input-field:focus { border-color: var(--accent); }

        .btn-send {
            padding: 12px 20px;
            background: var(--accent);
            border: none;
            border-radius: var(--radius);
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-send:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-send:active { transform: translateY(0); }
        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header { padding: 12px 16px; }
            .chat-container { padding: 16px; }
            .input-area { padding: 12px 16px; }
            .welcome h2 { font-size: 20px; }
            .suggestions { gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">G</div>
            <div>
                <div class="header-title">Great.cards Advisor</div>
                <div class="header-subtitle">AI-powered credit card recommendations</div>
            </div>
        </div>
        <button class="btn-reset" onclick="resetChat()" title="Start a new conversation">New Chat</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcome">
            <h2>Credit Card Advisor</h2>
            <p>Ask me about credit card recommendations, compare cards, check eligibility, or browse cards by category.</p>
            <div class="suggestions">
                <button class="suggestion" onclick="sendSuggestion(this)">I spend ₹15,000/month on Amazon. Best card?</button>
                <button class="suggestion" onclick="sendSuggestion(this)">Compare HDFC Regalia and Axis Magnus</button>
                <button class="suggestion" onclick="sendSuggestion(this)">Show me lifetime-free travel cards</button>
                <button class="suggestion" onclick="sendSuggestion(this)">Salaried, ₹8 LPA, pincode 400001. Eligible cards?</button>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-row">
            <input type="text" class="input-field" id="msgInput"
                   placeholder="Ask about credit cards..."
                   autocomplete="off"
                   onkeydown="if(event.key==='Enter' && !event.shiftKey) sendMessage()">
            <button class="btn-send" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let sessionId = null;
        const chatContainer = document.getElementById('chatContainer');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcome = document.getElementById('welcome');

        function sendSuggestion(el) {
            msgInput.value = el.textContent;
            sendMessage();
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            // Hide welcome on first message.
            if (welcome) welcome.style.display = 'none';

            // Show user message.
            appendMessage('user', text);
            msgInput.value = '';
            sendBtn.disabled = true;

            // Show typing indicator.
            const typingEl = showTyping();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: sessionId }),
                });

                const data = await res.json();
                sessionId = data.session_id;

                // Remove typing indicator.
                typingEl.remove();

                // Show bot response.
                appendMessage('bot', data.answer || 'No response.', data.policy_notes);

            } catch (err) {
                typingEl.remove();
                appendMessage('bot', 'Connection error. Please check if the server is running.');
            }

            sendBtn.disabled = false;
            msgInput.focus();
        }

        function appendMessage(role, text, policyNotes) {
            const wrapper = document.createElement('div');
            wrapper.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = role === 'user' ? '👤' : '💳';

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.innerHTML = formatText(text);

            // Append policy notes if present.
            if (policyNotes && policyNotes.length > 0) {
                const notesDiv = document.createElement('div');
                notesDiv.className = 'policy-notes';
                notesDiv.innerHTML = policyNotes.map(n => `⚠ ${escapeHtml(n)}`).join('<br>');
                bubble.appendChild(notesDiv);
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const el = document.createElement('div');
            el.className = 'typing';
            el.innerHTML = `
                <div class="msg-avatar" style="background:linear-gradient(135deg,var(--accent),#8b5cf6)">💳</div>
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>`;
            chatContainer.appendChild(el);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return el;
        }

        function formatText(text) {
            // Basic markdown-ish formatting.
            let html = escapeHtml(text);
            // Bold: **text**
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Bullet lists: lines starting with - or •
            html = html.replace(/^[\-•]\s+(.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
            // Numbered lists: lines starting with digit.
            html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');
            // Paragraphs: double newlines.
            html = html.replace(/\n\n+/g, '</p><p>');
            // Single newlines within paragraphs.
            html = html.replace(/\n/g, '<br>');
            return `<p>${html}</p>`;
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        async function resetChat() {
            if (sessionId) {
                try {
                    await fetch('/api/reset', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId }),
                    });
                } catch (_) {}
            }
            sessionId = null;
            chatContainer.innerHTML = '';
            // Re-add welcome.
            chatContainer.innerHTML = `
                <div class="welcome" id="welcome">
                    <h2>Credit Card Advisor</h2>
                    <p>Ask me about credit card recommendations, compare cards, check eligibility, or browse cards by category.</p>
                    <div class="suggestions">
                        <button class="suggestion" onclick="sendSuggestion(this)">I spend ₹15,000/month on Amazon. Best card?</button>
                        <button class="suggestion" onclick="sendSuggestion(this)">Compare HDFC Regalia and Axis Magnus</button>
                        <button class="suggestion" onclick="sendSuggestion(this)">Show me lifetime-free travel cards</button>
                        <button class="suggestion" onclick="sendSuggestion(this)">Salaried, ₹8 LPA, pincode 400001. Eligible cards?</button>
                    </div>
                </div>`;
            msgInput.focus();
        }

        // Focus input on load.
        msgInput.focus();
    </script>
</body>
</html>
